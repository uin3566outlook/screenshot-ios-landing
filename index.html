  <body data-app-store-url="">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header">
      <div class="header-inner container">
        <a class="brand" href="#top" aria-label="局部分享，返回顶部">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>局部分享</span>
        </a>
        <nav class="desktop-nav" aria-label="页面导航">
          <a href="#demo">操作演示</a>
          <a href="#features">实用功能</a>
        </nav>
        <nav class="language-picker" aria-label="切换语言">
          <button type="button" data-language="zh-Hans" aria-label="简体中文">简</button>
          <button type="button" data-language="zh-Hant" aria-label="繁體中文">繁</button>
          <button type="button" data-language="en" aria-label="English">EN</button>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="hero" id="top" aria-labelledby="hero-title">
        <div class="hero-glow" aria-hidden="true"></div>
        <div class="container hero-grid">
          <div class="hero-copy">
            <div class="eyebrow"><span class="eyebrow-dot"></span> 为 iPhone 而做的截图工具</div>
            <h1 id="hero-title">截图，<br /><em>只发重点。</em></h1>
            <p class="hero-description">看到值得分享的内容，框选重点，按需标注，直接发到聊天 App。</p>
            <div class="hero-actions">
              <a class="button button-primary app-store-button" data-app-store-link role="link" aria-disabled="true">即将登陆 App Store <span aria-hidden="true">↗</span></a>
              <a class="button button-text" href="#demo">看看怎么用 <span aria-hidden="true">↗</span></a>
            </div>
          </div>

          <div class="hero-art" aria-label="局部分享 App 当前首页预览">
            <div class="hero-orbit orbit-one" aria-hidden="true"></div>
            <div class="hero-orbit orbit-two" aria-hidden="true"></div>
            <a class="phone phone-hero" data-screen="home" href="assets/home-en-4a66b80a.png" target="_blank" rel="noopener noreferrer" aria-label="打开高清首页截图">
              <div class="phone-screen"><img src="assets/home-en-4a66b80a.png" alt="局部分享首页：介绍截图、框选与分享流程，并提供设置极速截图和体验示例入口" width="1206" height="2622" fetchpriority="high" /></div>
            </a>
          </div>
        </div>
      </section>

      <section class="promo-demo section-pad" id="demo" aria-labelledby="demo-title">
        <div class="container promo-demo-grid">
          <div class="promo-demo-copy">
            <div class="section-kicker">看看真实操作</div>
            <h2 id="demo-title">截取、裁剪、<br /><span>直接发到聊天。</span></h2>
            <p>真实录屏，演示局部裁剪后快速发送到 WhatsApp。</p>
          </div>
          <div class="promo-player">
            <video data-promo-video autoplay muted loop playsinline webkit-playsinline preload="auto" poster="assets/clipshare-demo-poster.jpg" width="884" height="1920" aria-label="局部分享操作演示：截图、裁剪并分享到聊天 App">
              <source src="assets/clipshare-demo.mp4" type="video/mp4" />
            </video>
            <div class="promo-player-controls">
              <button class="promo-sound-toggle" type="button" data-promo-sound aria-pressed="false" aria-label="Turn sound on">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h3l4-3v12l-4-3H4z"/><path class="sound-off-icon" d="m16 9 5 6m0-6-5 6"/><path class="sound-on-icon" d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></svg>
                <span data-sound-label></span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="features section-pad" id="features" aria-labelledby="features-title">
        <div class="container">
          <h2 id="features-title">为日常分享准备。</h2>
          <div class="feature-grid">
            <article class="feature-card">
              <div><h3>标注重点</h3><p>添加箭头、文字和涂鸦，或遮住不想公开的信息。</p></div>
            </article>
            <article class="feature-card">
              <div><h3>本地处理</h3><p>截图只在设备上编辑，快捷截图不会自动把原图存入相册。</p></div>
            </article>
            <article class="feature-card">
              <div><h3>一次设置，随时截取</h3><p>将快捷指令绑定到轻点背面或操作按钮，需要时立即开始。</p></div>
              <a class="inline-link" href="https://www.icloud.com/shortcuts/01208ce292214df48dd0a61de7b7f883" target="_blank" rel="noopener noreferrer">设置快捷截图 <span aria-hidden="true">↗</span></a>
            </article>
          </div>
        </div>
      </section>
